services:
  - type: web
    name: crosssync-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://zqhmerojxldeqxdjdvqb.supabase.co
      - key: SUPABASE_KEY
        sync: false  # This means you'll enter it manually in Render
      - key: SUPABASE_SERVICE_KEY
        sync: false
    autoDeploy: true